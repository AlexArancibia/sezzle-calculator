services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: calculator
      POSTGRES_PASSWORD: calculator
      POSTGRES_DB: calculator
    ports:
      - "5440:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U calculator -d calculator"]
      interval: 2s
      timeout: 3s
      retries: 20

  backend:
    build: ./backend
    environment:
      PORT: "8080"
      DATABASE_URL: postgres://calculator:calculator@db:5432/calculator?sslmode=disable
      # Local demo key. Use real secrets (and more than one key to rotate) in production.
      API_KEYS: ${API_KEY:-local-dev-key}
      # The API docs page calls the API directly from the browser, so its origins are allowed.
      CORS_ORIGINS: http://localhost:3000,http://localhost:5173
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./frontend
    environment:
      API_KEY: ${API_KEY:-local-dev-key}
      BACKEND_URL: http://backend:8080
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  db-data:
